<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Event Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
        }

        h2 {
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Event Registration</h1>

    <h2>Tech Innovation Summit 2026 - Registration Open</h2>
    <p><strong>Registration is now open for all students.</strong></p>

    <p>
        Join us for a technology-focused event featuring innovation,
        emerging technologies, student projects, and technical discussions.
    </p>

    <form>

        <label for="name">Student Name</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label for="regno">Register Number</label>
        <input type="text" id="regno" placeholder="Enter register number">

        <label for="department">Department</label>
        <input type="text" id="department" placeholder="Enter department">

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter email">

        <label for="date">Event Date</label>
        <input type="date" id="date">

        <button type="submit">Register for Event</button>

    </form>

</div>

</body>
</html>
